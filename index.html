<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexTalk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="auth-screen" class="auth-screen">
  <div class="auth-panel">
    <div class="brand">
      <div class="brand-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>
      <span class="brand-name">NexTalk</span>
    </div>
    <h1 class="auth-title">Masuk ke akun Anda</h1>
    <p class="auth-sub">Chat, panggilan suara, dan voice note. Realtime.</p>

    <form id="auth-form" autocomplete="off">
      <label class="field">
        <span class="field-label">Username</span>
        <input id="auth-user" type="text" placeholder="Masukkan username" autocomplete="username" required>
      </label>
      <label class="field">
        <span class="field-label">Password</span>
        <input id="auth-pass" type="password" placeholder="Masukkan password" autocomplete="current-password" required>
      </label>
      <p id="auth-error" class="auth-error"></p>
      <button type="button" id="btn-login" class="btn btn-primary btn-block">Masuk</button>
      <button type="button" id="btn-register" class="btn btn-ghost btn-block">Buat akun baru</button>
    </form>
  </div>
</section>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <header class="sidebar-head">
      <div class="brand">
        <div class="brand-mark brand-mark-sm">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </div>
        <span class="brand-name">NexTalk</span>
      </div>
      <button id="btn-logout" class="icon-btn" title="Keluar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </header>

    <div class="search-wrap">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search-input" class="search-input" placeholder="Cari username" autocomplete="off">
    </div>

    <div id="search-results" class="list"></div>
    <div class="section-label">Online</div>
    <div id="online-list" class="list"></div>

    <footer class="sidebar-foot">
      <div class="me-pill">
        <div class="me-avatar" id="me-avatar"></div>
        <div class="me-meta">
          <span class="me-name" id="me-name"></span>
          <span class="me-status">Online</span>
        </div>
      </div>
    </footer>
  </aside>

  <main class="chat-panel">
    <div id="chat-empty" class="empty">
      <div class="empty-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>
      <h2>Belum ada percakapan</h2>
      <p>Cari username atau pilih kontak yang online untuk memulai.</p>
    </div>

    <div id="chat-view" class="chat-view hidden">
      <header class="chat-head">
        <div class="chat-user">
          <div class="me-avatar" id="chat-avatar"></div>
          <div>
            <span class="chat-name" id="chat-with"></span>
            <span class="chat-sub" id="chat-status">Online</span>
          </div>
        </div>
        <div class="chat-actions">
          <button id="btn-voice-call" class="icon-btn" title="Panggilan suara">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.37 1.9.72 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.35 1.85.59 2.81.72A2 2 0 0 1 22 16.92z"/></svg>
          </button>
          <button id="btn-end-call" class="icon-btn icon-btn-danger hidden" title="Akhiri panggilan">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.37 1.9.72 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.35 1.85.59 2.81.72A2 2 0 0 1 22 16.92z"/><line x1="23" y1="1" x2="1" y2="23"/></svg>
          </button>
        </div>
      </header>

      <div id="messages" class="messages"></div>

      <div class="rec-status hidden" id="rec-status">
        <span class="rec-dot"></span> Merekam <span id="rec-time">0s</span>
      </div>

      <div class="composer">
        <button id="btn-record" class="icon-btn" title="Voice note">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>
        <input id="msg-input" class="msg-input" placeholder="Tulis pesan" autocomplete="off">
        <button id="btn-send" class="btn btn-primary btn-send">Kirim</button>
      </div>
    </div>
  </main>
</div>

<audio id="remote-audio" autoplay></audio>
<script src="https://nextalk-production.up.railway.app/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
